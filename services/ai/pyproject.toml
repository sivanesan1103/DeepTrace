[tool.poetry]
name = "deeptrace-ai"
version = "0.1.0"
description = "AI assistant service with Ollama streaming chat for DeepTrace"
authors = ["DeepTrace Team <team@deeptrace.io>"]
packages = [{include = "deeptrace_ai", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
httpx = "^0.27.0"
redis = "^5.2.0"
sse-starlette = "^2.1.0"
pydantic = "^2.10.0"
structlog = "^24.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"