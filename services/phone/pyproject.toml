[tool.poetry]
name = "phone-service"
version = "0.1.0"
description = "Phone number intelligence service with carrier lookup"
authors = ["DeepTrace Team <team@deeptrace.io>"]
packages = [{include = "phone_service", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {version = "^0.31.0", extras = ["standard"]}
redis = "^5.2.0"
phonenumbers = "^8.13.0"
httpx = "^0.27.0"
pydantic = "^2.10.0"
structlog = "^24.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"