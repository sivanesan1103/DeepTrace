[tool.poetry]
name = "deeptrace-common"
version = "0.1.0"
description = "Shared Python common library with core schemas, enums, and security utilities for DeepTrace"
authors = ["DeepTrace Team <team@deeptrace.io>"]
packages = [{include = "deeptrace_common", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
sqlalchemy = "^2.0.0"
pydantic = "^2.10.0"
redis = "^5.2.0"
httpx = "^0.27.0"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
passlib = {version = "^1.7.0", extras = ["bcrypt"]}
alembic = "^1.14.0"
structlog = "^24.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"