name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
      - '*-release-*'

jobs:
  deploy-prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://deeptrace.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

      - name: Backup database
        run: |
          echo "Creating database backup..."
          # Add backup commands here
          docker compose exec postgres pg_dump -U deeptrace deeptrace > backup_${{ github.sha }}.sql

      - name: Deploy with Docker Compose
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

      - name: Wait for services
        run: |
          sleep 60

      - name: Health check
        run: |
          curl -f https://deeptrace.app/health || (docker compose logs && exit 1)

      - name: Run post-deployment tests
        run: |
          echo "Running smoke tests..."
          # Add smoke test commands

      - name: Deploy notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Production deployment ${{ job.status }}: ${{ github.ref_name }}`,
              body: `Deployment of tag ${{ github.ref_name }} finished with status: ${{ job.status }}`
            })
